name: Update global markets chart

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 UTC 01:00 = 北京时间 09:00
  workflow_dispatch: {}    # 允许在 GitHub 网页上手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest index data and regenerate index.html
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Update market data $(date -u +%Y-%m-%d)"
          git push
